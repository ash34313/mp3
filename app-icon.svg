<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Vibrant Purple Accent Gradient for Music Note -->
    <linearGradient id="note-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a076ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>

    <!-- Glowing Effect for the Music Note -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- iOS Squircle Mask -->
    <clipPath id="ios-squircle">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115"/>
    </clipPath>
  </defs>

  <!-- Main Squircle Icon Canvas -->
  <g clip-path="url(#ios-squircle)">
    <!-- Base Background -->
    <rect width="512" height="512" fill="url(#bg-grad)"/>

    <!-- Subtle Background Accent Ring -->
    <circle cx="256" cy="256" r="180" fill="none" stroke="#21262d" stroke-width="16" opacity="0.6"/>
    <circle cx="256" cy="256" r="130" fill="none" stroke="#30363d" stroke-width="4" opacity="0.4"/>

    <!-- Centered Musical Note Vector -->
    <g filter="url(#glow)" transform="translate(10, -5)">
      <!-- Beamed Eighth Notes Symbol -->
      <path d="M 210,310 
               C 210,337.6 187.6,360 160,360 
               C 132.4,360 110,337.6 110,310 
               C 110,282.4 132.4,260 160,260 
               C 173.5,260 185.8,265.4 194.8,274.1 
               L 194.8,160 
               L 334.8,120 
               L 334.8,270 
               C 334.8,297.6 312.4,320 284.8,320 
               C 257.2,320 234.8,297.6 234.8,270 
               C 234.8,242.4 257.2,220 284.8,220 
               C 298.3,220 310.6,225.4 319.6,234.1 
               L 319.6,155 
               L 210,186 
               Z" 
            fill="url(#note-grad)"/>
    </g>

    <!-- Outer Subdued Border -->
    <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="none" stroke="#30363d" stroke-width="8"/>
  </g>
</svg>
